<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="实时信号流交互原型：主导航、连续时间线、趋势和动态详情。">
  <title>实时信号流 / FrontArt Demo</title>
  <link rel="stylesheet" href="demo.css">
  <link rel="stylesheet" href="signal-feed.css">
  <script src="demo.js" defer></script>
</head>
<body class="feed-demo" data-recipe="signal-feed">
  <header class="feed-mobile-head"><a href="#feed" class="feed-mobile-brand">F</a><span>首页</span><a href="../recipes/demo.html?style=signal-feed">配方</a></header>
  <main class="feed-layout">
    <aside class="feed-navigation">
      <div class="brand-x" aria-label="Signal 社区"><strong>F</strong></div>
      <nav aria-label="主导航">
        <a class="selected" aria-label="首页" href="#feed"><span aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v9a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"/></svg></span><b>首页</b></a>
        <a aria-label="探索" href="#topics"><span aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg></span><b>探索</b></a>
        <a aria-label="通知" href="#topics"><span aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg></span><b>通知</b></a>
        <a aria-label="私信" href="#feed"><span aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5h16v12H9l-5 4z"/><path d="M8 9h8M8 13h5"/></svg></span><b>私信</b></a>
        <a aria-label="书签" href="#saved"><span aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></svg></span><b>书签</b></a>
        <a aria-label="个人资料" href="#profile"><span aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span><b>个人资料</b></a>
      </nav>
      <button id="compose" type="button">发布</button>
      <div class="mini-profile" id="profile"><span>林</span><div><b>林间风</b><small>@lin-design</small></div><b aria-hidden="true">···</b></div>
      <a class="recipe-exit" href="../recipes/demo.html?style=signal-feed">返回配方说明</a>
    </aside>

    <section class="feed-column" id="feed" aria-label="首页时间线">
      <div class="feed-tabs" role="tablist" aria-label="时间线类型">
        <button class="is-active" type="button" data-feed="for-you" role="tab" aria-selected="true">为你推荐</button>
        <button type="button" data-feed="following" role="tab" aria-selected="false">正在关注</button>
      </div>
      <div class="composer">
        <span class="post-avatar">林</span>
        <div class="composer-main">
          <button type="button" id="open-composer">有什么新发现？</button>
          <div class="composer-toolbar"><div><span title="图片">▧</span><span title="表情">☺</span><span title="投票">☷</span></div><button id="composer-submit" type="button">发布</button></div>
        </div>
      </div>
      <form id="compose-form" hidden><label for="post-text">发布动态</label><textarea id="post-text" rows="3" placeholder="分享一个观察、问题或进度…"></textarea><div><button type="submit">发布动态</button></div></form>
      <div id="posts"></div>
      <div id="saved" class="feed-extra"><h2>你的书签</h2><p>保存的动态会在这里继续阅读。</p></div>
    </section>

    <aside class="right-rail">
      <label class="feed-search"><span aria-hidden="true">⌕</span><input id="feed-search" type="search" placeholder="搜索"></label>
      <section id="topics" class="trend-panel"><h2>正在发生</h2><a href="#feed"><small>设计 · 正在讨论</small><b># 让界面更像一本刊物</b><span>128 条动态</span></a><a href="#feed"><small>开发 · 热门话题</small><b># CSS 的新可能</b><span>84 条动态</span></a><a href="#feed"><small>独立创作 · 本周</small><b># 独立开发日志</b><span>53 条动态</span></a><a class="more-trends" href="#feed">查看更多趋势 →</a></section>
      <section class="follow-panel"><h2>值得关注</h2><div class="follow-item"><span class="suggested-avatar avatar-blue">周</span><span><b>周末造物</b><small>@weekend-build</small></span><button type="button">关注</button></div><div class="follow-item"><span class="suggested-avatar avatar-orange">鹭</span><span><b>鹭</b><small>@photo-notes</small></span><button type="button">关注</button></div></section>
      <p class="feed-footnote">原创互动原型 · 动态和账号均为虚构内容</p>
    </aside>
  </main>
</body>
</html>
